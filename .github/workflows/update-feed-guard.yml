name: Update feed guard

# No build of Builders Bot may read or install a release of the upstream Builders Bot app (phase 0 of the
# update design). `scripts/update-feed-guard-e2e.ts` needs no build and no network, so it runs on
# each pull request and on each push to the Builders Bot branches. `ci.yml` runs only for `main`.
on:
  pull_request:
  push:
    branches: [builders-bot, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-feed-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    name: Update feed guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: ./.github/actions/setup-bun
        with:
          install: ignore-scripts

      - name: Check that no build reads or installs the upstream Builders Bot app
        run: bun scripts/update-feed-guard-e2e.ts

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: update-feed-guard
          path: .buildersbot-build/update-system/feed-guard-report.json
          if-no-files-found: warn
